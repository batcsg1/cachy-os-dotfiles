background {
    monitor =
    path = screenshot
    blur_passes = 2
}

label {
    monitor =
    text = cmd[update:1000] date +"%I:%M:%S %p"
    color = rgba(255, 255, 255, 0.9)
    font_size = 90
    font_family = DepartureMono Nerd Font Mono
    position = 0, 300
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%A, %B %d, %Y"
    color = rgba(255, 255, 255, 0.7)
    font_size = 24
    font_family = DepartureMono Nerd Font Mono
    position = 0, 210
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 3
    dots_center = true
    position = 0, -50
    halign = center
    valign = center
    inner_color = rgba(0, 0, 0, 0)
    outer_color = rgba(255, 255, 255, 1)
    font_color = rgba(255, 255, 255, 1)
    dots_color = rgba(255, 255, 255, 1)
}

label {
    monitor =
    text = cmd[update:1000] echo "Linux is love, Linux is life  "
    color = rgba(255, 255, 255, 0.7)
    font_size = 20
    font_family = DepartureMono Nerd Font Mono
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text =   + X: leave Hyprland |   + S: Shutdown |   + R: reboot
    color = rgba(255, 255, 255, 0.5)
    font_size = 14
    font_family = DepartureMono Nerd Font Mono
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:0] echo "Powered by  Debian $(awk -F'"' '/^VERSION_ID/ {print $2}' /etc/os-release) $(awk -F'=' '/^VERSION_CODENAME/ {print $2}' /etc/os-release)"
    color = rgba(168, 0, 48, 0.9)
    font_size = 14
    font_family = DepartureMono Nerd Font Mono
    position = 0, 50
    halign = center
    valign = bottom
}
