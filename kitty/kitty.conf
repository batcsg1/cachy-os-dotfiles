# Nord — matches waybar
# Polar Night #2E3440 #3B4252 #434C5E #4C566A
# Snow Storm  #D8DEE9 #E5E9F0 #ECEFF4
# Frost       #8FBCBB #88C0D0 #81A1C1 #5E81AC
# Aurora      #BF616A #D08770 #EBCB8B #A3BE8C #B48EAD

background            #2E3440
background_opacity    0.85
foreground            #D8DEE9

cursor                #88C0D0
cursor_text_color     #2E3440
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
cursor_trail_color    #81A1C1

selection_background  #434C5E
selection_foreground  #ECEFF4

url_color             #88C0D0
url_style             curly

# Window borders
window_border_width   1.5pt
active_border_color   #88C0D0
inactive_border_color #3B4252
bell_border_color     #BF616A

# Tab bar
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_background      #2E3440
active_tab_background   #88C0D0
active_tab_foreground   #2E3440
active_tab_font_style   bold
inactive_tab_background #3B4252
inactive_tab_foreground #4C566A

# black
color0  #3B4252
color8  #4C566A

# red
color1  #BF616A
color9  #BF616A

# green
color2  #A3BE8C
color10 #A3BE8C

# yellow
color3  #EBCB8B
color11 #EBCB8B

# blue
color4  #81A1C1
color12 #81A1C1

# magenta
color5  #B48EAD
color13 #B48EAD

# cyan
color6  #88C0D0
color14 #8FBCBB

# white
color7  #E5E9F0
color15 #ECEFF4

# Fonts
font_family      DepartureMono Nerd Font Mono
bold_font        DepartureMono Nerd Font Mono
italic_font      DepartureMono Nerd Font Mono
bold_italic_font DepartureMono Nerd Font Mono
font_size        6

# Fall back to the symbols font for Nerd Font glyphs (fixes tofu boxes)
# needs: sudo pacman -S ttf-nerd-fonts-symbols-mono
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD Symbols Nerd Font Mono

# Remote control (was for rgb-cycle.sh; safe to remove if unused)
allow_remote_control socket-only
listen_on            unix:/tmp/kitty

# Keybinds
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+f5 load_config_file
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
