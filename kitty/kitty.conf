# ROG RGB — neon spectrum on black
background            #000000
background_opacity    0.75
foreground            #e6e6f0

cursor                #ff00aa
cursor_text_color     #000000
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
cursor_trail_color    #00e5ff

selection_background  #3a1060
selection_foreground  #ffffff

url_color             #00e5ff
url_style             curly

# Window borders
window_border_width   1.5pt
active_border_color   #d500f9
inactive_border_color #1a1024
bell_border_color     #ff1744

# Tab bar
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_background      #000000
active_tab_background   #d500f9
active_tab_foreground   #000000
active_tab_font_style   bold
inactive_tab_background #0d0a14
inactive_tab_foreground #7a7090

# black
color0  #121218
color8  #4a4a5a

# red
color1  #ff1744
color9  #ff5370

# green
color2  #00e676
color10 #69ff94

# yellow
color3  #ffd600
color11 #ffea61

# blue
color4  #2979ff
color12 #5c9dff

# magenta
color5  #d500f9
color13 #e66bff

# cyan
color6  #00e5ff
color14 #6ef3ff

# white
color7  #d8d8e8
color15 #ffffff

# Fonts
font_family      DepartureMono Nerd Font Mono
bold_font        DepartureMono Nerd Font Mono
italic_font      DepartureMono Nerd Font Mono
bold_italic_font DepartureMono Nerd Font Mono
font_size        8

# Remote control (needed for rgb-cycle.sh; safe to remove if unused)
allow_remote_control socket-only
listen_on            unix:/tmp/kitty

# Keybinds
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+f5 load_config_file
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
